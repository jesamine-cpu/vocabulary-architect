<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>單字記憶連結法 (Word Chunk Edition)</title>
    
    <!-- 1. 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. 載入 Regenerator Runtime (解決 Babel async/await 報錯的核心關鍵) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/regenerator-runtime/0.13.9/runtime.min.js"></script>

    <!-- 3. 載入 React 和 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 4. 載入 Babel 用於解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 解決 Google Sites iframe 列印問題的樣式 -->
    <style>
        @media print {
            body * {
                visibility: hidden;
            }
            #root, #root * {
                visibility: visible;
            }
            #root {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
            .no-print {
                display: none !important;
            }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
        // ==========================================
        // 【設定區】如果您想將 Key 寫死在程式碼中，請填入下方
        // ==========================================
        const defaultApiKey = ""; 
        // ==========================================

        const { useState, useEffect, useRef } = React;

        // --- 安全的 localStorage 讀取 ---
        const safeGetStorage = (key, defaultValue) => {
            try {
                const item = localStorage.getItem(key);
                return item ? JSON.parse(item) : defaultValue;
            } catch (e) { return defaultValue; }
        };

        const safeSetStorage = (key, value) => {
            try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
        };

        // --- Icons ---
        const Icon = ({ path, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{path}</svg>
        );

        const icons = {
            BookOpen: <><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></>,
            CheckCircle: <><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>,
            Printer: <><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2-2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></>,
            Trash2: <><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></>,
            Video: <><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></>,
            Mic: <><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></>,
            MicOff: <><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></>,
            RefreshCw: <><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></>,
            AlertCircle: <><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>,
            Wand2: <><path d="m19 2 2 2-2 2-2-2 2-2Z"/><path d="m5 6 2 2-2 2-2-2 2-2Z"/><path d="m11 2 2 2-2 2-2-2 2-2Z"/><path d="m11 6 2 2-2 2-2-2 2-2Z"/><path d="m12.5 12.5-4 4a2.828 2.828 0 1 0 4 4l4-4-2-2Z"/><path d="m15 11-1 1"/></>,
            AlertTriangle: <><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></>,
            Lightbulb: <><line x1="9" y1="18" x2="15" y2="18"/><line x1="10" y1="22" x2="14" y2="22"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 16.5 8 4.5 4.5 0 0 0 12 3.5 4.5 4.5 0 0 0 7.5 8c0 1.42.74 2.68 1.91 3.5.76.76 1.23 1.52 1.41 2.5"/></>,
            Loader2: <><path d="M21 12a9 9 0 1 1-6.219-8.56"/></>,
            FileText: <><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></>,
            ArrowLeft: <><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></>,
            Download: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></>,
            ListChecks: <><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></>,
            Key: <><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></>,
            ExternalLink: <><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></>,
            Save: <><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></>,
            Upload: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></>
        };

        const VocabularyLinker = () => {
            const initialWordState = {
                targetWord: '', associations: ['', '', '', '', ''], associationStatus: [null, null, null, null, null],
                sentence: '', checked: false, checkerName: '', speechStatus: 'idle', isAnalyzing: false
            };

            const [apiKey, setApiKey] = useState(() => {
                try { return localStorage.getItem('gemini_api_key') || defaultApiKey; } catch(e) { return defaultApiKey; }
            });
            const [showKeyInput, setShowKeyInput] = useState(false);
            const [studentInfo, setStudentInfo] = useState({ className: '', seatNo: '', name: '', unit: 'U1' });
            const [words, setWords] = useState(Array(15).fill(null).map(() => ({ ...initialWordState })));
            const [showVideo, setShowVideo] = useState(true);
            const [viewMode, setViewMode] = useState('edit');
            const [listeningIndex, setListeningIndex] = useState(null); 
            const recognitionRef = useRef(null);
            
            // 檔案匯入的 ref
            const fileInputRef = useRef(null);

            useEffect(() => {
                const savedData = safeGetStorage('vocabLinkerData', null);
                if (savedData) {
                    setStudentInfo(prev => ({ ...prev, ...(savedData.studentInfo || {}), unit: savedData.studentInfo?.unit || 'U1' }));
                    const loadedWords = (savedData.words || []).map(w => ({
                        ...initialWordState, ...w,
                        associationStatus: w.associationStatus || [null, null, null, null, null],
                        speechStatus: w.checked ? 'success' : 'idle', isAnalyzing: false
                    }));
                    while(loadedWords.length < 15) loadedWords.push({ ...initialWordState });
                    setWords(loadedWords);
                }
            }, []);

            useEffect(() => { safeSetStorage('vocabLinkerData', { studentInfo, words }); }, [studentInfo, words]);

            const handleApiKeyChange = (e) => {
                const newKey = e.target.value;
                setApiKey(newKey);
                try { localStorage.setItem('gemini_api_key', newKey); } catch(e){}
            };

            const updateWord = (index, updates) => {
                setWords(prev => {
                    const newWords = [...prev];
                    newWords[index] = { ...newWords[index], ...updates };
                    return newWords;
                });
            };

            // --- 新增：匯出功能 (下載 JSON) ---
            const handleExportData = () => {
                const dataStr = JSON.stringify({ studentInfo, words });
                const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
                const exportFileDefaultName = `Vocab_${studentInfo.name || 'Student'}_${new Date().toISOString().slice(0,10)}.json`;

                const linkElement = document.createElement('a');
                linkElement.setAttribute('href', dataUri);
                linkElement.setAttribute('download', exportFileDefaultName);
                linkElement.click();
            };

            // --- 新增：匯入功能 (讀取 JSON) ---
            const handleImportClick = () => {
                fileInputRef.current.click();
            };

            const handleFileChange = (event) => {
                const fileObj = event.target.files && event.target.files[0];
                if (!fileObj) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const importedData = JSON.parse(e.target.result);
                        if (importedData.studentInfo && importedData.words) {
                             if(confirm('確定要載入此檔案嗎？目前的進度將被覆蓋。')) {
                                setStudentInfo(importedData.studentInfo);
                                const loadedWords = importedData.words.map(w => ({
                                    ...initialWordState, ...w,
                                    associationStatus: w.associationStatus || [null, null, null, null, null],
                                    speechStatus: w.checked ? 'success' : 'idle', isAnalyzing: false
                                }));
                                setWords(loadedWords);
                                alert('進度載入成功！');
                             }
                        } else {
                            alert('檔案格式錯誤，找不到必要的資料。');
                        }
                    } catch (error) {
                        alert('無法讀取檔案，請確認是否為正確的 .json 格式');
                    }
                };
                reader.readAsText(fileObj);
                event.target.value = ''; // Reset input
            };

            // --- AI 檢查 ---
            const analyzeAssociationsWithAI = (index) => {
                if (!apiKey) {
                    alert("請點擊右上角的「🔑 API Key」設定您的 Google Gemini API Key 才能使用 AI 功能。");
                    setShowKeyInput(true);
                    return;
                }

                const word = words[index];
                const target = word.targetWord.trim();
                
                if (!target) { alert("請先輸入主題單字 (Target Word)"); return; }

                const basicStatuses = [...word.associationStatus];
                const assocsToCheck = [];
                const seenValues = new Set();
                
                word.associations.forEach((assoc, i) => {
                    const val = assoc.trim().toLowerCase();
                    const targetLower = target.toLowerCase();
                    basicStatuses[i] = null;
                    if (!val) { basicStatuses[i] = { type: 'error', msg: '未填寫' }; return; }
                    if (val === targetLower) { basicStatuses[i] = { type: 'error', msg: '請延伸成語塊' }; return; }
                    if (seenValues.has(val)) { basicStatuses[i] = { type: 'error', msg: '語塊已重複' }; return; }
                    seenValues.add(val);
                    assocsToCheck.push({ text: assoc, index: i });
                });

                if (assocsToCheck.length === 0) {
                    updateWord(index, { associationStatus: basicStatuses });
                    return;
                }

                updateWord(index, { isAnalyzing: true, associationStatus: basicStatuses });

                const promptText = `
                    Role: Strict English Teacher specializing in collocations and lexical chunks.
                    Task: Evaluate if the following phrases are natural English "Word Chunks" (Collocations) containing the Target Word.
                    Target Word: "${target}"
                    Phrases to check: ${JSON.stringify(assocsToCheck.map(a => a.text))}
                    Rules:
                    1. Phrase MUST contain Target Word.
                    2. Phrase MUST be a natural collocation.
                    3. Return JSON array of objects: { "valid": boolean, "msg": string (Max 15 chars, Traditional Chinese) }.
                    Output ONLY raw JSON.
                `;

                fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
                })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(errData => {
                            throw new Error(errData.error?.message || response.statusText);
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    const resultText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (resultText) {
                        const cleanJson = resultText.replace(/```json/g, '').replace(/```/g, '').trim();
                        try {
                            const analysisResults = JSON.parse(cleanJson);
                            const finalStatuses = [...basicStatuses];
                            
                            analysisResults.forEach((res, idx) => {
                                if (assocsToCheck[idx]) {
                                    const originalIndex = assocsToCheck[idx].index;
                                    if (res.valid) {
                                        finalStatuses[originalIndex] = { type: 'success', msg: res.msg || '道地語塊' };
                                    } else {
                                        finalStatuses[originalIndex] = { type: 'warning', msg: res.msg || '建議修正搭配' };
                                    }
                                }
                            });
                            updateWord(index, { associationStatus: finalStatuses, isAnalyzing: false });
                        } catch (parseError) {
                            throw new Error("AI 回傳格式錯誤 (JSON Parse Failed)");
                        }
                    } else {
                        throw new Error("AI 未回傳任何文字");
                    }
                })
                .catch(error => {
                    console.error("AI Check Failed:", error);
                    const fallbackStatuses = [...basicStatuses];
                    assocsToCheck.forEach(({ text, index: i }) => {
                        fallbackStatuses[i] = { type: 'neutral', msg: '連線失敗(僅基本檢查)' };
                    });
                    updateWord(index, { associationStatus: fallbackStatuses, isAnalyzing: false });
                    alert(`AI 檢查失敗！\n\n可能原因：\n1. API Key 無效或額度已滿\n2. 網路連線問題\n\n錯誤訊息: ${error.message}`);
                });
            };

            const startListening = (index) => {
                const targetWord = words[index].targetWord;
                if (!targetWord.trim()) { alert("請先輸入單字"); return; }
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) { alert("請使用 Chrome/Edge 瀏覽器"); return; }
                if (listeningIndex === index) { stopListening(); return; }
                if (listeningIndex !== null) recognitionRef.current?.stop();

                try {
                    const recognition = new SpeechRecognition();
                    recognition.lang = 'en-US'; 
                    recognition.continuous = false;
                    recognition.interimResults = false;
                    recognition.onstart = () => {
                        setListeningIndex(index);
                        updateWord(index, { speechStatus: 'listening', checkerName: '聆聽中...' });
                    };
                    recognition.onresult = (event) => {
                        if (event.results && event.results[0]) {
                            const transcript = event.results[0][0].transcript.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
                            const target = targetWord.toLowerCase().trim().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
                            if (transcript.includes(target)) updateWord(index, { checked: true, checkerName: 'AI 小助教 (Pass)', speechStatus: 'success' });
                            else updateWord(index, { checked: false, checkerName: `聽成: ${transcript}`, speechStatus: 'error' });
                        }
                    };
                    recognition.onerror = (e) => {
                        let msg = '辨識失敗';
                        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
                            msg = '權限被拒';
                            alert("❌ 麥克風權限被阻擋\n\n請允許瀏覽器使用麥克風權限。");
                        }
                        updateWord(index, { speechStatus: 'error', checkerName: msg });
                        setListeningIndex(null);
                    };
                    recognition.onend = () => setListeningIndex(null);
                    recognitionRef.current = recognition;
                    recognition.start();
                } catch (e) { alert("無法啟動麥克風"); }
            };

            const stopListening = () => recognitionRef.current?.stop();
            const handleInfoChange = (e) => setStudentInfo(prev => ({ ...prev, [e.target.name]: e.target.value }));
            const handleWordChange = (index, field, value) => {
                let updates = { [field]: value };
                if (field === 'checked') { updates.speechStatus = value ? 'success' : 'idle'; updates.checkerName = value ? '手動確認' : ''; }
                if (field === 'targetWord') updates.associationStatus = [null, null, null, null, null];
                updateWord(index, updates);
            };
            const handleAssociationChange = (wIdx, aIdx, val) => {
                const newWords = [...words];
                newWords[wIdx].associations[aIdx] = val;
                newWords[wIdx].associationStatus[aIdx] = null;
                setWords(newWords);
            };
            const handleClearAll = () => {
                if (confirm('確定重置？這將清除目前所有內容。')) {
                    setWords(Array(15).fill(null).map(() => ({ ...initialWordState })));
                    setStudentInfo(p => ({ ...p, unit: 'U1' }));
                    try { localStorage.removeItem('vocabLinkerData'); } catch(e){}
                }
            };
            const getStatusStyles = (s) => {
                if(s==='success') return 'bg-green-50 border-green-400 ring-1 ring-green-200';
                if(s==='error') return 'bg-red-50 border-red-400 ring-1 ring-red-200';
